<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nsoro</title>

    <!-- Short summary that search engines (like Google) can show under the site name.
         TEMPLATE wording: replace with Nsoro's own description. -->
    <meta
      name="description"
      content="Nsoro clothing. Shop the denim suit, suede desert boots and the latest lookbook."
    />

    <!-- Tab icons: the "N" from the Nsoro logo.
         favicon.ico for browser tabs and search results, a sharper PNG for modern
         browsers, and a larger one for phones when the site is saved to the home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Paint the page dark denim straight away, before the main stylesheet arrives,
         so visitors never see a white flash while the site loads. -->
    <style>
      html {
        background: #152837;
      }
    </style>

    <!-- Welcome page only: start downloading the full-screen welcome photo right now,
         at the same time as the site's code, instead of waiting for the code to run
         first. Other pages skip this so they don't download a photo they won't show. -->
    <script>
      if (location.pathname === "/") {
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = "/lookbook/ED241652.webp";
        preload.fetchPriority = "high";
        document.head.appendChild(preload);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
